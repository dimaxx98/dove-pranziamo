<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dove pranziamo?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap');

  .sheet{  const ref = new Date(now);
  if(now.getHours() < RESET_HOUR) ref.setDate(ref.getDate() - 1);
  return `${ref.getFullYear()}-${pad(ref.getMonth()+1)}-${pad(ref.getDate())}`;
}
function calendarDateStr(){
  const now = new Date();
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
}
function canRemoveNow(){ return new Date().getHours() >= REMOVE_FROM_HOUR; }
function uniqueVoterCount(){ return Object.keys(state.voters || {}).length; }
function myConfirmedPicks(){ return (state.voterPicks && state.voterPicks[myName]) || null; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- icons ---- */
function wheelIconSvg(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/><circle cx="12" cy="12" r="2"/></svg>`; }
function exclaimIconSvg(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5"/><path d="M12 17h.01"/></svg>`; }
function laurelSvg(side){
  return `<svg class="laurel ${side}" viewBox="0 0 24 40" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M12 38 C 8 30, 8 20, 12 2"/>
    <ellipse cx="9" cy="10" rx="3" ry="1.6" transform="rotate(-30 9 10)"/>
    <ellipse cx="8" cy="18" rx="3" ry="1.6" transform="rotate(-20 8 18)"/>
    <ellipse cx="9" cy="26" rx="3" ry="1.6" transform="rotate(-15 9 26)"/>
    <ellipse cx="10" cy="33" rx="3" ry="1.6" transform="rotate(-10 10 33)"/>
  </svg>`;
}

/* ---- firestore period rollover ---- */
async function appendDailyLog(periodKey, tallies, winner){
  if(!periodKey) return;
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(logRef);
      const data = snap.exists ? snap.data() : { days: [] };
      const days = data.days || [];
      if(!days.some(d => d.date === periodKey)) days.push({ date: periodKey, tallies, winner: winner || null });
      tx.set(logRef, { days: days.slice(-30) });
    });
  }catch(e){ console.error('Errore log giornaliero', e); }
}

async function ensureFreshPeriod(data){
  const current = periodStr();
  if(data.voteDate !== current){
    const prevPeriod = data.voteDate;
    if(prevPeriod){
      const tallies = {};
      Object.values(data.restaurants || {}).forEach(r => { tallies[r.name] = (tallies[r.name]||0) + (r.votes||0); });
      let winner = null;
      if(data.history && data.history[0] && data.history[0].periodKey === prevPeriod) winner = data.history[0].name;
      await appendDailyLog(prevPeriod, tallies, winner);
    }
    const resetRestaurants = {};
    Object.keys(data.restaurants || {}).forEach(id => { resetRestaurants[id] = { ...data.restaurants[id], votes: 0 }; });
    const fresh = { restaurants: resetRestaurants, history: data.history || [], voters: {}, voterPicks: {}, voteDate: current };
    await docRef.set(fresh);
    return fresh;
  }
  return data;
}

async function ensurePermanentExist(data){
  const missing = {};
  PERMANENT.forEach(p => { if(!data.restaurants || !data.restaurants[p.id]) missing[`restaurants.${p.id}`] = { name: p.name, votes: 0, addedBy: 'sistema', permanent: true }; });
  if(!data.voters) missing['voters'] = {};
  if(!data.voterPicks) missing['voterPicks'] = {};
  if(Object.keys(missing).length){
    await docRef.update(missing);
    const snap = await docRef.get();
    return snap.data();
  }
  return data;
}

/* ---- render ---- */
function render(){
  const el = document.getElementById('content');
  if(!configOk){ el.innerHTML = '<p class="empty">Completa prima la configurazione (vedi avviso qui sopra).</p>'; return; }

  if(!myName){
    el.innerHTML = `
      <div class="name-gate">
        <p>Come ti chiami, per capire chi ha votato cosa?</p>
        <input type="text" id="name-input" placeholder="Il tuo nome" maxlength="24">
        <div><button id="name-save">Imbarco</button></div>
        <p class="error" id="name-error">Scrivi un nome prima di continuare.</p>
      </div>`;
    document.getElementById('name-save').onclick = () => {
      const val = document.getElementById('name-input').value.trim();
      if(!val){ document.getElementById('name-error').style.display = 'block'; return; }
      myName = val; localStorage.setItem('lunch-my-name', val); render();
    };
    document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('name-save').click(); });
    return;
  }

  const list = Object.entries(state.restaurants || {}).map(([id, r]) => ({ id, ...r }));
  const sorted = [...list].sort((a,b) => b.votes - a.votes);
  const leader = sorted[0];
  const removeOk = canRemoveNow();
  const lastWin = state.history && state.history[0];
  const confirmed = myConfirmedPicks();
  const votedToday = !!confirmed;

  const medalHtml = lastWin ? `
    <div class="medal-banner">
      ${laurelSvg('left')}
      <div class="medal-text">
        <div class="medal-label">Ultima missione compiuta</div>
        <div class="medal-name">${escapeHtml(lastWin.name)}</div>
        <div class="medal-sub">${lastWin.date}${lastWin.addedBy ? ' · proposta da ' + escapeHtml(lastWin.addedBy) : ''}</div>
      </div>
      ${laurelSvg('right')}
    </div>` : `
    <div class="medal-banner empty"><div class="medal-text">Nessuna missione ancora compiuta: vota e poi decidete insieme.</div></div>`;

  const readoutHtml = leader
    ? `<div class="readout"><span class="rlabel">In pole position</span><span class="rvalue">${escapeHtml(leader.name)} · ${leader.votes} ${leader.votes===1?'voto':'voti'}</span></div>`
    : `<div class="readout"><span class="rlabel">In pole position</span><span class="rvalue">nessun bersaglio ancora</span></div>`;

  const voters = uniqueVoterCount();
  const enough = voters >= MIN_VOTERS && list.length >= 2;
  const decideHtml = `
    <div class="decide-zone">
      <div class="radar-ring">
        <div class="radar-sweep"></div>
        <button class="decide-btn-center ${enough ? 'ready':'locked'}" id="decide-center-btn" ${enough?'':'disabled'}
          aria-label="${enough ? 'Decidi la missione' : 'Servono più voti'}">
          ${enough ? wheelIconSvg() : exclaimIconSvg()}
        </button>
      </div>
      <div class="decide-caption">${enough ? 'Tocca per far decidere la ruota' : `Servono almeno ${MIN_VOTERS} colleghi che votino oggi (${voters}/${MIN_VOTERS})`}</div>
    </div>`;

  let itemsHtml = '';
  if(list.length === 0){
    itemsHtml = '<p class="empty">Nessuna missione proposta ancora.</p>';
  } else {
    itemsHtml = sorted.map(r => {
      const isConfirmed = votedToday && confirmed.includes(r.id);
      const isPending = !votedToday && pendingSelection.includes(r.id);
      const maxedOut = r.votes >= MAX_VOTES && !isConfirmed && !isPending;
      const pickLimitReached = !votedToday && !isPending && pendingSelection.length >= MAX_PICKS;
      const disablePick = votedToday || busy || maxedOut || pickLimitReached;
      const showRemove = !r.permanent && removeOk;
      let btnClass = 'vote-btn';
      if(isConfirmed) btnClass += ' voted';
      else if(isPending) btnClass += ' pending';
      if(maxedOut) btnClass += ' maxed';
      return `
        <div class="item">
          <button class="${btnClass}" data-id="${r.id}" ${disablePick ? 'disabled' : ''} aria-label="Seleziona ${escapeHtml(r.name)}">${isConfirmed ? '✓' : (isPending ? '●' : '+')}</button>
          <div class="name-wrap">
            <div class="name">${escapeHtml(r.name)}</div>
            ${r.permanent ? '<span class="perm-badge">fissa</span>' : ''}
          </div>
          <div class="votes">${r.votes}/${MAX_VOTES}</div>
          ${showRemove ? `<button class="remove-btn" data-remove="${r.id}" data-name="${escapeHtml(r.name)}" ${busy?'disabled':''} aria-label="Rimuovi ${escapeHtml(r.name)}">−</button>` : ''}
        </div>`;
    }).join('');
  }

  const limitNote = list.length >= MAX_RESTAURANTS
    ? `<p class="limit-note">Raggiunto il massimo di ${MAX_RESTAURANTS} proposte: rimuovine una per aggiungerne un'altra.</p>` : '';
  const nonPermCount = list.filter(r => !r.permanent).length;
  const removeHint = !removeOk && nonPermCount > 0
    ? `<p class="remove-hint">Le proposte extra si possono rimuovere solo dalle ${REMOVE_FROM_HOUR}:00 in poi, per non alterare il voto in corso.</p>` : '';

  let voteStatusHtml = '';
  if(votedToday){
    const names = confirmed.map(id => (state.restaurants[id] ? state.restaurants[id].name : '(rimossa)'));
    voteStatusHtml = `<p class="vote-status">Hai votato: ${escapeHtml(names.join(', ') || '—')}<span class="undo" id="undo-vote-btn">annulla e rivota</span></p>`;
  } else if(list.length > 0){
    voteStatusHtml = `
      <p class="vote-status">Seleziona fino a ${MAX_PICKS} proposte, poi conferma (${pendingSelection.length}/${MAX_PICKS})</p>
      <button class="confirm-btn ${pendingSelection.length >= 1 && !busy ? 'lit':'dark'}" id="confirm-vote-btn" ${pendingSelection.length >= 1 && !busy ? '' : 'disabled'}>OK!</button>`;
  }

  const addRowHtml = addFormOpen ? `
    <div class="add-row">
      <input type="text" id="new-name" placeholder="Nome del ristorante" maxlength="${MAX_NAME_LEN}" ${list.length>=MAX_RESTAURANTS || busy ? 'disabled':''}>
      <button class="add-btn" id="add-btn" aria-label="Aggiungi" ${list.length>=MAX_RESTAURANTS || busy ? 'disabled':''}>+</button>
    </div>
    <p class="error" id="add-error"></p>
    ${limitNote}` : '';

  el.innerHTML = `
    ${medalHtml}
    ${readoutHtml}
    ${decideHtml}
    <div class="section-head">
      <h2>Missioni proposte</h2>
      <div class="who-wrap">
        <span class="who">${escapeHtml(myName)}</span>
        <button class="change-name" id="change-name-btn">cambia</button>
      </div>
      <button class="toggle-add" id="toggle-add" aria-label="Aggiungi opzione">${addFormOpen ? '×' : '+'}</button>
    </div>
    ${itemsHtml}
    ${removeHint}
    ${addRowHtml}
    ${voteStatusHtml}
  `;

  document.querySelectorAll('.vote-btn').forEach(btn => { btn.onclick = () => togglePending(btn.dataset.id); });
  document.querySelectorAll('[data-remove]').forEach(btn => { btn.onclick = () => removeRestaurant(btn.dataset.remove, btn.dataset.name); });
  document.getElementById('toggle-add').onclick = () => { addFormOpen = !addFormOpen; render(); };
  document.getElementById('change-name-btn').onclick = () => {
    if(confirm('Vuoi cambiare il nome salvato su questo dispositivo?')){
      localStorage.removeItem('lunch-my-name'); myName = null; render();
    }
  };
  const undoBtn = document.getElementById('undo-vote-btn');
  if(undoBtn) undoBtn.onclick = undoVote;
  const confirmBtn = document.getElementById('confirm-vote-btn');
  if(confirmBtn) confirmBtn.onclick = confirmVotes;
  const addBtn = document.getElementById('add-btn');
  if(addBtn) addBtn.onclick = addRestaurant;
  const newNameInput = document.getElementById('new-name');
  if(newNameInput){ newNameInput.focus(); newNameInput.addEventListener('keydown', e => { if(e.key==='Enter') addRestaurant(); }); }

  const decideBtn = document.getElementById('decide-center-btn');
  if(decideBtn && enough) decideBtn.onclick = openDecisionModal;
}

/* ---- voting: select up to 2, then confirm ---- */
function togglePending(id){
  if(busy || myConfirmedPicks()) return;
  if(pendingSelection.includes(id)){
    pendingSelection = pendingSelection.filter(x => x !== id);
  } else {
    if(pendingSelection.length >= MAX_PICKS) return;
    pendingSelection = [...pendingSelection, id];
  }
  render();
}

async function confirmVotes(){
  if(busy || pendingSelection.length === 0 || myConfirmedPicks()) return;
  busy = true; render();
  const picks = [...pendingSelection];
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(docRef);
      const data = snap.data() || {};
      if(data.voterPicks && data.voterPicks[myName]){
        throw new Error('ALREADY_VOTED');
      }
      const updates = {};
      picks.forEach(id => {
        const current = (data.restaurants && data.restaurants[id]) ? data.restaurants[id].votes : 0;
        updates[`restaurants.${id}.votes`] = Math.min(MAX_VOTES, current + 1);
      });
      updates[`voters.${myName}`] = true;
      updates[`voterPicks.${myName}`] = picks;
      tx.update(docRef, updates);
    });
    pendingSelection = [];
  }catch(e){
    if(e && e.message === 'ALREADY_VOTED'){
      alert('Risulta che hai già votato oggi (magari da un altro dispositivo). Le tue scelte precedenti restano valide.');
    } else {
      console.error(e);
      alert('Errore nel confermare il voto: ' + (e && e.message ? e.message : e));
    }
  }
  busy = false; render();
}

async function undoVote(){
  if(busy) return;
  const confirmed = myConfirmedPicks();
  if(!confirmed) return;
  const ok = window.confirm('Vuoi annullare il tuo voto di oggi e rivotare?');
  if(!ok) return;
  busy = true; render();
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(docRef);
      const data = snap.data() || {};
      const updates = {};
      confirmed.forEach(id => {
        const current = (data.restaurants && data.restaurants[id]) ? data.restaurants[id].votes : 0;
        updates[`restaurants.${id}.votes`] = Math.max(0, current - 1);
      });
      updates[`voterPicks.${myName}`] = firebase.firestore.FieldValue.delete();
      tx.update(docRef, updates);
    });
    pendingSelection = [];
  }catch(e){ console.error(e); alert('Errore: ' + (e && e.message ? e.message : e)); }
  busy = false; render();
}

/* ---- CRUD ---- */
async function addRestaurant(){
  if(busy) return;
  const input = document.getElementById('new-name');
  const errEl = document.getElementById('add-error');
  const val = input.value.trim().replace(/\s+/g,' ');
  errEl.style.display = 'none';
  const currentList = Object.entries(state.restaurants || {}).map(([id, r]) => ({ id, ...r }));
  if(currentList.length >= MAX_RESTAURANTS){ errEl.textContent = `Massimo ${MAX_RESTAURANTS} proposte contemporanee.`; errEl.style.display='block'; return; }
  if(val.length < MIN_NAME_LEN){ errEl.textContent = `Il nome deve avere almeno ${MIN_NAME_LEN} caratteri.`; errEl.style.display='block'; return; }
  if(val.length > MAX_NAME_LEN){ errEl.textContent = `Il nome è troppo lungo (max ${MAX_NAME_LEN} caratteri).`; errEl.style.display='block'; return; }
  if(!NAME_PATTERN.test(val)){ errEl.textContent = 'Usa solo lettere, numeri e punteggiatura semplice (niente emoji o simboli strani).'; errEl.style.display='block'; return; }
  if(currentList.some(r => r.name.trim().toLowerCase() === val.toLowerCase())){ errEl.textContent = 'C\'è già una proposta con questo nome.'; errEl.style.display='block'; return; }

  busy = true; render();
  const id = 'r' + Date.now() + Math.floor(Math.random()*1000);
  try{ await docRef.update({ [`restaurants.${id}`]: { name: val, votes: 0, addedBy: myName } }); }
  catch(e){ console.error(e); alert('Errore nell\'aggiungere il ristorante: ' + (e && e.message ? e.message : e)); }
  busy = false; addFormOpen = false;
}

async function removeRestaurant(id, name){
  if(busy) return;
  if(PERMANENT_IDS.includes(id)) return;
  if(!canRemoveNow()){ alert(`Le rimozioni sono permesse solo dalle ${REMOVE_FROM_HOUR}:00 in poi.`); return; }
  const ok = window.confirm(`Rimuovere "${name}" dalla lista?`);
  if(!ok) return;
  busy = true; render();
  try{
    await docRef.update({ [`restaurants.${id}`]: firebase.firestore.FieldValue.delete() });
  }catch(e){
    console.error(e);
    alert('Non sono riuscito a rimuoverlo. Motivo restituito dal database:\n\n' + (e && e.message ? e.message : e));
  }
  busy = false; render();
}

/* ---- decision modal ---- */
function buildWheelMarkup(list, rotation){
  const n = list.length, seg = 360 / n;
  let gradientParts = [], labelsHtml = '';
  list.forEach((r, i) => {
    const color = PALETTE[i % PALETTE.length];
    const start = i * seg, end = start + seg;
    gradientParts.push(`${color} ${start}deg ${end}deg`);
    const mid = start + seg/2;
    labelsHtml += `<div class="slice-label" style="transform:rotate(${mid}deg);">${escapeHtml(r.name)}</div>`;
  });
  const bg = `conic-gradient(${gradientParts.join(',')})`;
  return `<div class="wheel-wrap"><div class="pointer"></div>
    <div class="wheel" id="modal-wheel-el" style="background:${bg}; transform:rotate(${rotation}deg);">${labelsHtml}</div>
    <div class="wheel-rivet"></div></div>`;
}
function goldFlash(){
  const f = document.createElement('div'); f.className = 'gold-flash';
  document.body.appendChild(f); setTimeout(() => f.remove(), 700);
}

async function announceAndClose(winner, titleText, statusText){
  const modalRoot = document.getElementById('modal-root');
  const titleEl = document.getElementById('modal-title');
  const statusEl = document.getElementById('modal-status');
  if(titleEl) titleEl.textContent = titleText;
  if(statusEl) statusEl.textContent = statusText;
  goldFlash();
  try{
    const newHistory = [{ name: winner.name, date: calendarDateStr(), addedBy: winner.addedBy || null, periodKey: periodStr() }, ...(state.history || [])].slice(0, 10);
    await docRef.update({ history: newHistory });
  }catch(e){ console.error(e); }
  setTimeout(() => { modalRoot.innerHTML = ''; spinning = false; render(); }, 1500);
}

function openDecisionModal(){
  const list = Object.entries(state.restaurants || {}).map(([id, r]) => ({ id, ...r }));
  if(spinning || list.length < 2 || uniqueVoterCount() < MIN_VOTERS) return;
  spinning = true;

  const maxVotes = Math.max(...list.map(r => r.votes));
  const tied = list.filter(r => r.votes === maxVotes);

  if(tied.length === 1){
    runWheelToWinner(list, tied[0]);
  } else if(tied.length === 2){
    runCoinFlip(tied[0], tied[1]);
  } else {
    runRadarLock(tied);
  }
}

function runWheelToWinner(list, winner){
  const rotation = window.__wheelRotation || 0;
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title" id="modal-title">Estrazione in corso…</div>
        ${buildWheelMarkup(list, rotation)}
        <div class="modal-status" id="modal-status"></div>
      </div>
    </div>`;

  const n = list.length, seg = 360 / n;
  const winnerIndex = list.findIndex(r => r.id === winner.id);
  const segMid = winnerIndex * seg + seg/2;
  const baseTurns = 5 * 360;
  const targetWithinCircle = (360 - segMid) % 360;
  const currentMod = ((rotation % 360) + 360) % 360;
  const delta = (targetWithinCircle - currentMod + 360) % 360;
  const newRotation = rotation + baseTurns + delta;

  setTimeout(() => {
    const wheelEl = document.getElementById('modal-wheel-el');
    if(wheelEl) wheelEl.style.transform = `rotate(${newRotation}deg)`;
  }, 250);

  setTimeout(() => {
    window.__wheelRotation = newRotation;
    announceAndClose(winner, 'Missione assegnata', '🎯 ' + winner.name);
  }, 250 + 3600);
}

function runCoinFlip(a, b){
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title" id="modal-title">Pareggio: lancio della moneta…</div>
        <div class="coin-wrap">
          <div class="coin" id="coin-el">
            <div class="coin-face front">${escapeHtml(a.name)}</div>
            <div class="coin-face back">${escapeHtml(b.name)}</div>
          </div>
        </div>
        <div class="modal-status" id="modal-status"></div>
      </div>
    </div>`;
  const heads = Math.random() < 0.5;
  const winner = heads ? a : b;
  const baseSpins = 6 * 360;
  const target = baseSpins + (heads ? 0 : 180);
  setTimeout(() => {
    const coinEl = document.getElementById('coin-el');
    if(coinEl) coinEl.style.transform = `rotateY(${target}deg)`;
  }, 200);
  setTimeout(() => {
    announceAndClose(winner, 'La moneta ha deciso', (heads ? '🪙 Testa: ' : '🪙 Croce: ') + winner.name);
  }, 200 + 2200);
}

function runRadarLock(tied){
  const modalRoot = document.getElementById('modal-root');
  const winnerIdx = Math.floor(Math.random() * tied.length);
  modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title" id="modal-title">Pareggio a ${tied.length}: aggancio radar in corso…</div>
        <div class="lock-list" id="lock-list">
          ${tied.map((r,i) => `<div class="lock-item" data-i="${i}">${escapeHtml(r.name)}</div>`).join('')}
        </div>
        <div class="modal-status" id="modal-status"></div>
      </div>
    </div>`;
  let step = 0;
  const totalSteps = 22;
  function tick(){
    const els = Array.from(document.querySelectorAll('.lock-item'));
    els.forEach(el => el.classList.remove('lock-active'));
    const idx = step < totalSteps - 1 ? step % tied.length : winnerIdx;
    if(els[idx]) els[idx].classList.add('lock-active');
    step++;
    if(step < totalSteps){
      const delay = 60 + Math.pow(step, 1.9) * 1.3;
      setTimeout(tick, delay);
    } else {
      const winner = tied[winnerIdx];
      announceAndClose(winner, 'Bersaglio agganciato', '🔒 ' + winner.name);
    }
  }
  tick();
}

/* ---- init ---- */
async function init(){
  if(!configOk){ render(); return; }
  try{
    const snap = await docRef.get();
    if(!snap.exists){
      const restaurants = {};
      PERMANENT.forEach(p => { restaurants[p.id] = { name: p.name, votes: 0, addedBy: 'sistema', permanent: true }; });
      const fresh = { restaurants, history: [], voters: {}, voterPicks: {}, voteDate: periodStr() };
      await docRef.set(fresh);
      state = fresh;
    } else {
      let data = snap.data();
      data = await ensurePermanentExist(data);
      state = await ensureFreshPeriod(data);
    }
    docRef.onSnapshot(
      doc => { if(doc.exists){ state = doc.data(); if(!spinning) render(); } },
      err => showFatalError(err)
    );
    render();

    // ricontrolla ogni minuto se è scattata la soglia delle 14:00, anche ad app già aperta
    setInterval(async () => {
      if(spinning || busy) return;
      if(state.voteDate !== periodStr()){
        try{
          const snap = await docRef.get();
          if(snap.exists) state = await ensureFreshPeriod(snap.data());
        }catch(e){ console.error('Errore controllo reset periodico', e); }
      }
    }, 60000);
  }catch(e){ showFatalError(e); }
}

function showFatalError(e){
  console.error('Errore Firestore', e);
  document.getElementById('content').innerHTML = `
    <p class="empty">
      Errore di connessione al database.<br>
      <span style="font-size:12px;opacity:0.75;">${escapeHtml(e && e.message ? e.message : String(e))}</span><br><br>
      <button onclick="location.reload()" style="background:var(--amber);color:#241705;border:none;border-radius:6px;padding:9px 18px;font-weight:700;cursor:pointer;">Riprova</button>
    </p>`;
}

init();
</script>
